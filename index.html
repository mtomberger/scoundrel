<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- BUILD:HEAD -->
<title>Scoundrel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<link rel="stylesheet" href="css/style.css">
<!-- /BUILD:HEAD -->
</head>
<body>
<!-- BUILD:BODY -->
<!-- Alle Texte kommen aus js/i18n.js (data-i18n*-Attribute). -->
<div id="app">
  <header class="bar">
    <div class="brand" aria-label="Scoundrel">SCOUNDREL</div>
    <div class="bar-tools">
      <button class="ibtn ibtn-text ibtn-lang" id="btn-lang" type="button" data-i18n-aria="aria.langSwitch" data-i18n-title="aria.langSwitch"></button>
      <button class="ibtn" id="btn-sfx" type="button" aria-pressed="true" data-i18n-aria="aria.sfx" data-i18n-title="title.sfx"><img alt="" data-icon="speaker"></button>
      <button class="ibtn" id="btn-music" type="button" aria-pressed="false" data-i18n-aria="aria.music" data-i18n-title="title.music"><img alt="" data-icon="note"></button>
      <button class="ibtn ibtn-text" id="btn-help" type="button" data-i18n-aria="aria.rules" data-i18n-title="aria.rules">?</button>
      <button class="ibtn" id="btn-pause" type="button" data-i18n-aria="aria.menu" data-i18n-title="title.menu"><img alt="" data-icon="menu"></button>
    </div>
  </header>

  <main class="table" id="table" data-i18n-aria="aria.table">
    <div class="cell cell-status">
      <span class="room-no" id="room-no"></span>
      <span class="pips" id="pips" data-i18n-aria="aria.pips"><i></i><i></i><i></i></span>
      <span class="potion-flag" id="potion-flag"></span>
    </div>

    <div class="cell cell-deck">
      <div class="pile" id="pile-dungeon"><img class="pile-img" id="deck-img" alt=""></div>
      <div class="pile-label"><span data-i18n="pile.dungeon"></span> <b id="dungeon-count">44</b></div>
    </div>

    <div class="cell cell-room">
      <div class="room" id="room"></div>
    </div>

    <div class="cell cell-discard">
      <div class="pile" id="pile-discard"><img class="pile-img" id="discard-img" alt=""></div>
      <div class="pile-label"><span data-i18n="pile.discard"></span> <b id="discard-count">0</b></div>
    </div>

    <div class="cell cell-hp">
      <div class="hp" id="hp">
        <img class="hp-heart" id="hp-heart" alt="">
        <div class="hp-main">
          <div class="hp-num"><span id="hp-val">20</span><span class="hp-max">/20</span></div>
          <div class="hp-word" data-i18n="hp.word"></div>
        </div>
      </div>
      <div class="hp-bar" id="hp-bar" role="meter" data-i18n-aria="aria.hp" aria-valuemin="0" aria-valuemax="20" aria-valuenow="20"></div>
    </div>

    <div class="cell cell-weapon">
      <div class="weapon-stack" id="weapon-stack"></div>
      <div class="weapon-label">
        <span class="weapon-name" id="weapon-name"></span>
        <span class="weapon-limit" id="weapon-limit"></span>
      </div>
    </div>

    <div class="cell cell-actions">
      <button class="btn btn-flee" id="btn-flee" type="button"><img alt="" data-icon="door"><span data-i18n="flee"></span></button>
      <div class="flee-hint" id="flee-hint"></div>
    </div>
  </main>

  <section class="log" id="log" aria-live="polite" data-i18n-aria="aria.log"></section>
</div>

<!-- Kampfauswahl -->
<div class="choice" id="choice" role="dialog" data-i18n-aria="aria.choice" hidden>
  <div class="choice-title" id="choice-title"></div>
  <div class="choice-btns">
    <button class="btn btn-steel" id="ch-weapon" type="button"></button>
    <button class="btn btn-blood" id="ch-fist" type="button"></button>
  </div>
  <div class="choice-note" id="choice-note"></div>
  <button class="choice-cancel" id="ch-cancel" type="button"><span data-i18n="cancel"></span> <small>[Esc]</small></button>
</div>

<!-- Titelbildschirm -->
<div class="overlay overlay-title" id="ov-title" hidden>
  <div class="title-wrap">
    <div class="torch torch-l" aria-hidden="true"></div>
    <div class="torch torch-r" aria-hidden="true"></div>
    <h1 class="logo">SCOUNDREL</h1>
    <p class="tagline" data-i18n="tagline"></p>
    <div class="fan" id="title-fan" aria-hidden="true"></div>
    <div class="menu">
      <button class="btn btn-gold" id="t-continue" type="button" data-i18n="t.continue" hidden></button>
      <button class="btn btn-gold" id="t-new" type="button" data-i18n="t.new"></button>
      <button class="btn" id="t-daily" type="button" data-i18n="t.daily"></button>
      <button class="btn" id="t-rules" type="button" data-i18n="t.rules"></button>
    </div>
    <p class="records" id="t-records"></p>
    <div class="lang-switch" role="group" data-i18n-aria="aria.lang">
      <button class="lang-opt" type="button" data-lang="de" lang="de">Deutsch</button>
      <button class="lang-opt" type="button" data-lang="en" lang="en">English</button>
    </div>
    <p class="credit" data-i18n-html="credit"></p>
  </div>
</div>

<!-- Regeln -->
<div class="overlay" id="ov-rules" hidden>
  <div class="panel panel-rules" role="dialog" aria-labelledby="rules-h">
    <div class="panel-head">
      <h2 id="rules-h" data-i18n="rules.h"></h2>
      <button class="btn btn-small" type="button" data-close data-i18n="close"></button>
    </div>
    <div class="rules" id="rules-body" data-i18n-html="rules.body"></div>
  </div>
</div>

<!-- Pause -->
<div class="overlay" id="ov-pause" hidden>
  <div class="panel panel-small" role="dialog" aria-labelledby="pause-h">
    <h2 id="pause-h" data-i18n="pause.h"></h2>
    <p class="mode-line" id="pause-mode"></p>
    <div class="menu">
      <button class="btn btn-gold" type="button" data-close data-i18n="p.resume"></button>
      <button class="btn" type="button" id="p-rules" data-i18n="t.rules"></button>
      <button class="btn" type="button" id="p-restart" data-i18n="p.restart"></button>
      <button class="btn" type="button" id="p-menu" data-i18n="p.menu"></button>
    </div>
  </div>
</div>

<!-- Spielende -->
<div class="overlay" id="ov-end" hidden>
  <div class="panel panel-end" role="dialog" aria-labelledby="end-h">
    <h2 class="end-title" id="end-h"></h2>
    <p class="mode-line" id="end-mode"></p>
    <div class="score-box">
      <div class="score-label" data-i18n="end.scoreLabel"></div>
      <div class="score" id="end-score">0</div>
      <div class="score-calc" id="end-calc"></div>
      <div class="badge" id="end-best" data-i18n="end.best" hidden></div>
    </div>
    <dl class="stats" id="end-stats"></dl>
    <div class="menu menu-row">
      <button class="btn btn-gold" type="button" id="e-again"></button>
      <button class="btn" type="button" id="e-same" data-i18n="e.same"></button>
      <button class="btn" type="button" id="e-menu" data-i18n="e.menu"></button>
    </div>
  </div>
</div>

<div class="flash" id="flash" aria-hidden="true"></div>
<!-- /BUILD:BODY -->

<!-- BUILD:SCRIPTS -->
<script src="js/i18n.js"></script>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<!-- /BUILD:SCRIPTS -->
</body>
</html>
